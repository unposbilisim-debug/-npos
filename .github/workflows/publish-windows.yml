name: Windows EXE

on:
  push:
  pull_request:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained EXE
        run: >
          dotnet publish src/UnposVardiyaTakip.Win/UnposVardiyaTakip.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
      - name: Zip
        shell: pwsh
        run: |
          $out = "dist/UnposVardiyaTakip"
          New-Item -ItemType Directory -Force -Path "$out/samples" | Out-Null
          Copy-Item src/UnposVardiyaTakip.Win/bin/Release/net8.0-windows/win-x64/publish/UnposVardiyaTakip.exe $out/
          Copy-Item samples/* "$out/samples/"
          Compress-Archive -Path $out\* -DestinationPath UnposVardiyaTakip.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UnposVardiyaTakip
          path: UnposVardiyaTakip.zip
          if-no-files-found: error

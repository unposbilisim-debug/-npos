name: Windows EXE

on:
  push:
  pull_request:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained EXE
        run: >
          dotnet publish src/UnposVardiyaTakip.Win/UnposVardiyaTakip.Win.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Prepare source tree
        shell: pwsh
        run: |
          function Copy-Source($src, $dst) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Get-ChildItem -LiteralPath $src -Force | ForEach-Object {
              if ($_.Name -in @('.git','bin','obj','.vs','publish','dist','kaynak')) { return }
              $target = Join-Path $dst $_.Name
              if ($_.PSIsContainer) { Copy-Source $_.FullName $target }
              else { Copy-Item -LiteralPath $_.FullName -Destination $target -Force }
            }
          }
          Copy-Source (Get-Location) kaynak

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc setup\akaryakit-proje.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Pack desktop folder
        shell: pwsh
        run: |
          $out = "dist/Akaryakit Proje"
          New-Item -ItemType Directory -Force -Path "$out/samples","$out/Kaynak" | Out-Null
          Copy-Item publish/UnposVardiyaTakip.exe $out/
          Copy-Item samples/* "$out/samples/"
          Copy-Item OKU.txt $out/
          Copy-Item MasaustuneKur.bat $out/
          Copy-Item -Recurse -Force kaynak/* "$out/Kaynak/"
          Copy-Item dist/AkaryakitProje-Setup.exe dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path $out -DestinationPath dist/AkaryakitProje-Masaustu.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AkaryakitProje
          path: |
            dist/AkaryakitProje-Setup.exe
            dist/AkaryakitProje-Masaustu.zip
          if-no-files-found: error
